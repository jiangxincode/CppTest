name: Sonar Report
on:
  push:
    branches: [ master ]

jobs:
  build-linux:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        preset: [ "linux-x64-release" ]
    steps:
      - uses: actions/checkout@v3

      - name: Install some dependencies
        run: |
          # https://blog.csdn.net/xiong_xin/article/details/148389435
          sudo apt-get clean
          sudo apt-get update
          sudo apt-get upgrade
          sudo apt-get install -y libgtk-3-dev
          # https://github.com/freeglut/freeglut
          sudo apt-get install libgl-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxi-dev

      - name: Cache vcpkg
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/out/build/${{ matrix.preset }}/vcpkg_installed
          key: "${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}"

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Download build-wrapper
        run: |
          wget https://sonarcloud.io/static/cpp/build-wrapper-linux-x86.zip
          unzip build-wrapper-linux-x86.zip

      - name: Build
        working-directory: ${{github.workspace}}
        run: |
          ./build-wrapper-linux-x86/build-wrapper-linux-x86-64 --out-dir bw_output cmake --build --preset ${{ matrix.preset }}

      - name: Run SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io